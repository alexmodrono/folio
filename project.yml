name: Folio
options:
  bundleIdPrefix: app.folio
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_ENTITLEMENTS: Folio/Resources/Folio.entitlements
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    # Release builds are signed for distribution outside the App Store and notarized by scripts/release.sh.
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 54WRV8QX2U
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # Notarization rejects get-task-allow, which Xcode would otherwise add.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  # The only third-party dependency: installs updates. Pinned exactly because the generated
  # project (and its Package.resolved) isn't checked in.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Folio:
    type: application
    platform: macOS
    sources:
      - path: Folio
        excludes:
          - Resources/AppIcon.icon
      # Icon Composer document; actool compiles it into the app icon with Liquid Glass.
      - path: Folio/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Folio
        PRODUCT_BUNDLE_IDENTIFIER: app.folio.Folio
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Folio/Resources/Info.plist
    info:
      path: Folio/Resources/Info.plist
      properties:
        CFBundleName: Folio
        CFBundleDisplayName: Folio
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Folio is not affiliated with, endorsed or sponsored by OpenAI. ChatGPT is a trademark of OpenAI."
        NSMicrophoneUsageDescription: ChatGPT voice input uses the microphone.
        # GitHub repository ("owner/name") where Help > Report a Problem opens issues.
        FolioRepository: alexmodrono/folio
        # Sparkle: the appcast is an asset of the latest GitHub release (made by .github/workflows/release.yml),
        # signed with the EdDSA key whose public half is below.
        SUFeedURL: https://github.com/alexmodrono/folio/releases/latest/download/appcast.xml
        SUPublicEDKey: cUI4hLg1WlIEojZT2D9NGn9NSvokEQyMayDEfWaFck8=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
  FolioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FolioTests
    dependencies:
      - target: Folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folio.FolioTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ""
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Folio.app/Contents/MacOS/Folio
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Folio:
    build:
      targets:
        Folio: all
        FolioTests: [test]
    test:
      targets:
        - FolioTests
