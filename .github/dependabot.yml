version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      docs-site:
        patterns: ["*"]
# Sparkle is pinned with exactVersion in project.yml (XcodeGen), which Dependabot can't update.
