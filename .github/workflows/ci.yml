name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build and test
    # Xcode 27, the version Folio is developed with (still a preview image on GitHub).
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unit tests
        # Debug builds are signed ad hoc, so no certificate is needed.
        run: scripts/test.sh
      - name: Release configuration compiles
        run: |
          set -o pipefail
          xcodegen generate --quiet
          xcodebuild -project Folio.xcodeproj -scheme Folio -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/release" CODE_SIGNING_ALLOWED=NO build | tail -5

  docs:
    name: Documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
