name: Release

# Pushing a tag like v1.1 or v1.1.2 on a commit in main builds, signs, notarizes and publishes
# Folio-<version>.dmg with a Sparkle appcast as a GitHub release. The tag's message becomes the
# release notes, which the update window shows too.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build number is the commit count, and the notes come from the annotated tag.
          fetch-depth: 0

      - name: Check the tag
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Tags look like v1.1 or v1.1.2"; exit 1; }
          git fetch --force --tags origin
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME isn't on main"; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # An annotated tag's message (without its signature) is the notes; a lightweight tag gets a default line.
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          fi
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" 2>/dev/null \
            || echo "Folio ${GITHUB_REF_NAME#v} for macOS 26 and later." > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up signing and notarization
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          for name in CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD APPLE_ID NOTARIZATION_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::The $name secret is missing"; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          PASSWORD=$(uuidgen)
          echo "::add-mask::$PASSWORD"
          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/certificate.p12"
          xcrun notarytool store-credentials folio-notary --apple-id "$APPLE_ID" --team-id 54WRV8QX2U \
            --password "$NOTARIZATION_PASSWORD" --keychain "$KEYCHAIN"

      - name: Build, notarize and sign the update
        env:
          FOLIO_VERSION: ${{ steps.version.outputs.version }}
          FOLIO_KEYCHAIN: ${{ env.KEYCHAIN }}
          FOLIO_RELEASE_NOTES: ${{ runner.temp }}/notes.md
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_ED_KEY" ] || { echo "::error::The SPARKLE_PRIVATE_ED_KEY secret is missing"; exit 1; }
          scripts/release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Folio-$VERSION.dmg" dist/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Folio $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "### Folio $VERSION"
            echo
            shasum -a 256 "dist/Folio-$VERSION.dmg" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
